<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better NCM Share</title>
    <!-- 1. APlayer 的样式文件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    <!-- 2. APlayer 的核心 JS 文件 -->
    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    <!-- 3. MetingJS 插件 -->
    <script src="https://cdn.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js"></script>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        textarea {
            height: 250px;
        }

        body {
            min-height: 100vh;
            margin: 0;
        }

        #content {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .frame {
            width: 100%;
            height: 100%;
            border: 0;
            flex-grow: 1;
        }

        #share-link {
            font-size: 1.25rem;
        }

        .card {
            margin: 5px;
            display: flex;
            flex-direction: row;
            height: 12rem;
            gap: 8px;
        }

        .infos {
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-tags {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        meting-js {
            display: block;
            position: relative;
            width: 100%;
        }

        .back {
            position: absolute;
            margin: 5px;
        }

        .aplayer {
            position: relative;
            z-index: 1;
        }

        .user-avatar {
            border: solid grey 1px;
        }
    </style>
</head>

<body>
    <div id="content">
        <textarea name="link" id="link"></textarea>
        <input type="button" value="ok!" id="btn">
        <div>Link: <a id="share-link"></a></div>
        <div>
            <button id="copy-it-direct">复制direct链</button>
            <button id="copy-it">复制</button>
        </div>
    </div>
    <script type="module">
        import {
            getRealLink,
            getShareObj,
            shareObjToOrignal,
            shareObjToOrpheus,
            compressShareObj,
            decompressShareObj,
        } from "./script.js";
        import {
            getUserCard
        } from "./user-card.js";
        let btn = document.querySelector("#btn");
        let link_elem = document.querySelector("#link");
        let share_link_elem = document.querySelector("#share-link");
        let copy_it = document.querySelector("#copy-it");
        let copy_it_direct = document.querySelector("#copy-it-direct");
        let content = document.querySelector("#content");
        let share_obj, sl_pf, sl_ha;
        sl_pf = location.protocol + "//"
                + location.host
                + location.pathname;
        function gen_sl(obj){
            sl_ha = "#" + compressShareObj(obj);
        }
        btn.addEventListener("click", async () => {
            share_obj = await getShareObj(link_elem.value)
            console.log(share_obj);
            gen_sl(share_obj);
            share_link_elem.href = sl_pf + sl_ha;
            share_link_elem.innerHTML = sl_pf + sl_ha;
        })
        copy_it.addEventListener("click", async () => {
            gen_sl(share_obj);
            await navigator.clipboard.writeText(sl_pf + sl_ha);
        });
        copy_it_direct.addEventListener("click", async () => {
            gen_sl(share_obj);
            await navigator.clipboard.writeText(location.protocol + "//"
                + location.host + "/d" + sl_ha);
        });

        if (location.hash !== '' && location.hash !== '#') {
            share_obj = decompressShareObj(location.hash.slice(1));
            console.log(share_obj);
            let orp = shareObjToOrpheus(share_obj);
            let yyb = `http://a.app.qq.com/o/simple.jsp?pkgname=com.netease.cloudmusic&android_scheme=${encodeURIComponent(orp)}`;
            let org = shareObjToOrignal(share_obj);
            let ua = navigator.userAgent;
            // let auto;
            // if (location.search.includes("orp=1")) {
            // auto = orp;
            // } else if (ua.match(/QQ\/[0-9]/i) || location.search.includes("qq=1")) {
            // auto = yyb;
            // }else{
            // auto = org
            // }
            let mainContent = '';
            const k = share_obj.kind;

            switch (k) {
                case 0: // song
                    mainContent = `<meting-js server="netease" type="song" id="${share_obj.id}"><div class="back">正在加载组件...</div></meting-js>`;
                    break;
                case 1: // album
                    mainContent = `<meting-js server="netease" type="album" id="${share_obj.id}"><div class="back">正在加载组件...</div></meting-js>`;
                    break;
                case 2: // artist
                    mainContent = `<meting-js server="netease" type="artist" id="${share_obj.id}"><div class="back">正在加载组件...</div></meting-js>`;
                    break;
                case 6: // playlist
                    mainContent = `<meting-js server="netease" type="playlist" id="${share_obj.id}"><div class="back">正在加载组件...</div></meting-js>`;
                    break;
                case 3: // user
                    mainContent = await getUserCard(share_obj.id); // 异步等待返回字符串
                    break;
                case 4:
                case 5:
                    mainContent = `<iframe src="${org}" class="frame"></iframe>`;
                    break;
                default:
                    mainContent = '';
            }
            content.innerHTML = `
            <div style="display: flex; justify-content: space-between; margin:5px;">
            <a href="${yyb}"  id="share-link" >应用宝跳转</a>
            <a href="${org}"  id="share-link" >原链</a>
            <a href="${orp}"  id="share-link" >Orpheus协议</a>
            </div>
            ${mainContent}
            `;
        }
    </script>
</body>

</html>
